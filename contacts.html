<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#">MUSICIAN NAME</a>
    <nav><a href="#profile">プロフィール</a><a href="#concerts">コンサート</a><a href="#reservation">予約</a><a href="#contact">お問い合わせ</a></nav>
  </header>

  <main>
    <section id="contact" class="section section-soft">
      <p class="eyebrow">CONTACT</p><h2>お問い合わせ</h2>
      <form id="contact-form" class="form">
        <label>お名前<input name="name" required maxlength="100"></label>
        <label>メールアドレス<input name="email" type="email" required maxlength="254"></label>
        <label>お問い合わせ内容<textarea name="message" rows="6" required maxlength="3000"></textarea></label>
        <button class="button" type="submit">送信する</button>
        <p id="contact-message" class="form-message" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer>© <span id="year"></span> MUSICIAN NAME</footer>

  <!-- GASへのフォーム送信結果を受け取るためのiframe -->
  <iframe name="gas-result-frame" id="gas-result-frame" hidden></iframe>
  <script src="app.js"></script>
</body>
</html>
